[build]
  publish = "."

[[redirects]]
  from = "/qr-standee"
  to = "/qr-standee.html"
  status = 200

[[redirects]]
  from = "/standee"
  to = "/qr-standee.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Cache-Control = "public, max-age=0, must-revalidate"
